<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LUMIGO — Reyting Jadvali</title>
  <link rel="icon" type="image/svg+xml" href="../assets/logos/favicon.svg">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/animations.css">
  <link rel="stylesheet" href="../css/games.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
  <header id="lumigo-navbar"></header>
  <main class="container" id="lb-root" style="padding-top:24px;"></main>
  <footer id="lumigo-footer"></footer>

  <script defer src="../js/storage.js"></script>
  <script defer src="../js/language.js"></script>
  <script defer src="../js/theme.js"></script>
  <script defer src="../js/auth.js"></script>
  <script defer src="../js/levels.js"></script>
  <script defer src="../js/rewards.js"></script>
  <script defer src="../js/friends.js"></script>
  <script defer src="../js/music.js"></script>
  <script defer src="../js/search.js"></script>
  <script defer src="../js/games.js"></script>
  <script defer src="../js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.LUMIGO.app.initShell('leaderboard', false);
      const root = document.getElementById('lb-root');
      let tab = 'global';

      function render() {
        const L = window.LUMIGO;
        const st = L.storage;
        const me = st.getActiveUser();
        const users = st.getUsers();
        const myAge = st.getAgeGroup() || '18-24';

        let list = [...users];
        if (tab === 'friends' && me) {
          const allowed = new Set([me.id, ...(me.friends || [])]);
          list = list.filter(u => allowed.has(u.id));
        } else if (tab === 'age') {
          list = list.filter(u => u.ageGroup === myAge);
        }

        if (tab === 'weekly') {
          list.sort((a, b) => (b.weeklyScore || 0) - (a.weeklyScore || 0));
        } else {
          list.sort((a, b) => (b.xp || 0) - (a.xp || 0));
        }

        const top3 = list.slice(0, 3);

        root.innerHTML = `
          <div class="page-banner">
            <div>
              <span class="badge badge-orange">🏆 LOKAL DEMO REYTING</span>
              <h1 style="font-size:1.9rem;font-weight:900;margin-top:6px;">Reyting Jadvali (Leaderboard)</h1>
              <p style="color:var(--text-secondary);">Natijalar qurilmadagi lokal demo foydalanuvchilar orasida hisoblanadi.</p>
            </div>
          </div>

          <div class="tabs-bar">
            <button class="tab-btn ${tab === 'global' ? 'active' : ''}" data-lb="global">🌍 Global Ranking</button>
            <button class="tab-btn ${tab === 'weekly' ? 'active' : ''}" data-lb="weekly">📅 Weekly Ranking</button>
            <button class="tab-btn ${tab === 'friends' ? 'active' : ''}" data-lb="friends">🤝 Friends Ranking</button>
            <button class="tab-btn ${tab === 'age' ? 'active' : ''}" data-lb="age">🎯 Age Group (${myAge})</button>
          </div>

          <div class="podium-grid">
            ${top3.map((u, idx) => {
              const rank = L.levels.getRankTitle(u.level || 1);
              return `
                <div class="podium-card rank-${idx + 1}">
                  <div style="font-size:1.6rem;">${idx === 0 ? '🥇' : idx === 1 ? '🥈' : '🥉'}</div>
                  <div class="podium-avatar ${u.frame || 'frame-default'}">${u.avatar}</div>
                  <h3>${u.username}</h3>
                  <div style="font-size:0.82rem;color:var(--text-secondary);margin:4px 0;">${rank.badge} Lvl ${u.level} • ${rank.title}</div>
                  <span class="badge badge-cyan">${tab === 'weekly' ? u.weeklyScore + ' Weekly Pts' : u.xp + ' XP'}</span>
                </div>
              `;
            }).join('')}
          </div>

          <div class="panel-card" style="overflow-x:auto;">
            <table class="data-table">
              <thead>
                <tr>
                  <th>#</th>
                  <th>O'yinchi</th>
                  <th>Level / Rank</th>
                  <th>Yosh</th>
                  <th>Wins</th>
                  <th>${tab === 'weekly' ? 'Weekly Pts' : 'XP'}</th>
                </tr>
              </thead>
              <tbody>
                ${list.map((u, i) => {
                  const rank = L.levels.getRankTitle(u.level || 1);
                  const isMe = me && me.id === u.id;
                  return `
                    <tr style="${isMe ? 'background:rgba(34,211,238,0.12);font-weight:800;' : ''}">
                      <td>${i + 1}</td>
                      <td>${u.avatar} ${u.username} ${isMe ? '(Siz)' : ''}</td>
                      <td>${rank.badge} Lvl ${u.level} (${rank.title})</td>
                      <td>${u.ageGroup}</td>
                      <td>${u.wins}</td>
                      <td><strong>${tab === 'weekly' ? u.weeklyScore : u.xp}</strong></td>
                    </tr>
                  `;
                }).join('')}
              </tbody>
            </table>
          </div>
        `;

        root.querySelectorAll('[data-lb]').forEach(b => {
          b.onclick = () => { tab = b.getAttribute('data-lb'); render(); };
        });
      }

      window.addEventListener('lumigo:user-updated', render);
      render();
    });
  </script>
</body>
</html>
